<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1e293b">Polyglot Mirroring</text>
  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Synchronized A5 implementations across languages</text>
  
  <!-- Central Hub (LLM) -->
  <circle cx="300" cy="200" r="40" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="300" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">LLM</text>
  <text x="300" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Claude Code</text>
  
  <!-- TypeScript Implementation -->
  <rect x="80" y="120" width="120" height="80" rx="10" fill="#3178c6" filter="url(#shadow)"/>
  <text x="140" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">TypeScript</text>
  <text x="140" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">a5 (main)</text>
  <text x="140" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">Node.js ecosystem</text>
  <text x="140" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">Web-first</text>
  
  <!-- Python Implementation -->
  <rect x="80" y="280" width="120" height="80" rx="10" fill="#3776ab" filter="url(#shadow)"/>
  <text x="140" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Python</text>
  <text x="140" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">a5-py</text>
  <text x="140" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">Data science</text>
  <text x="140" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e1e7ff">ML/AI workflows</text>
  
  <!-- Rust Implementation -->
  <rect x="400" y="200" width="120" height="80" rx="10" fill="#ce422b" filter="url(#shadow)"/>
  <text x="460" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Rust</text>
  <text x="460" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffe1e1">a5-rs</text>
  <text x="460" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffe1e1">High performance</text>
  <text x="460" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ffe1e1">Systems programming</text>
  
  <!-- Synchronization Arrows -->
  <!-- TS to LLM -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- TS <-> LLM -->
  <path d="M200 160 Q250 180 260 190" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M260 210 Q250 220 200 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Python <-> LLM -->
  <path d="M200 320 Q250 300 260 210" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M260 190 Q250 280 200 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Rust <-> LLM -->
  <path d="M400 240 Q350 220 340 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M340 200 Q350 220 400 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Sync indicators -->
  <text x="230" y="175" font-family="Arial, sans-serif" font-size="10" fill="#64748b">sync</text>
  <text x="230" y="295" font-family="Arial, sans-serif" font-size="10" fill="#64748b">sync</text>
  <text x="350" y="215" font-family="Arial, sans-serif" font-size="10" fill="#64748b">sync</text>
  
  <!-- Benefits callout -->
  <rect x="20" y="20" width="180" height="60" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="30" y="35" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">Benefits:</text>
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• Same API across languages</text>
  <text x="30" y="62" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• Automated change propagation</text>
  <text x="30" y="74" font-family="Arial, sans-serif" font-size="9" fill="#64748b">• Language-agnostic contributions</text>
  
  <!-- Process callout -->
  <rect x="420" y="320" width="160" height="60" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="335" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#475569">Mirror Process:</text>
  <text x="430" y="350" font-family="Arial, sans-serif" font-size="9" fill="#64748b">1. Change made in any repo</text>
  <text x="430" y="362" font-family="Arial, sans-serif" font-size="9" fill="#64748b">2. LLM analyzes &amp; adapts</text>
  <text x="430" y="374" font-family="Arial, sans-serif" font-size="9" fill="#64748b">3. All mirrors updated</text>
</svg>