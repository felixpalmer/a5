name: website

# Production site (a5geo.org) deploys ONLY from the latest published release branch.
# We compare the pushed branch against `npm show a5-js@latest`, so prereleases
# (published under the 'beta' dist-tag) never take over the production site.
on:
  push:
    branches:
      - '*-release'

# Both site workflows push to `gh-pages`, so keep the deploys off each other's toes
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  check_branch:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.get_version.outputs.match }}
    steps:
      - name: Compare pushed branch to latest published version
        id: get_version
        run: |
          LATEST=$(npm show a5-js@latest version | grep -oE '^[0-9]+\.[0-9]+')
          echo "latest release branch: ${LATEST}-release, pushed: ${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" = "${LATEST}-release" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check_branch
    if: needs.check_branch.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Build website
        run: |
          cd website
          yarn install --immutable
          yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@dc18a3c6b46d56484cb63f291becd7ed4f0269b9 # v4.7.1
        with:
          branch: gh-pages
          folder: website/build
          clean: true
          # The maintainer preview (website-next.yml) owns next/ — leaving it out
          # of the source folder would otherwise make `clean` delete it
          clean-exclude: |
            /next
