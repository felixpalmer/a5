name: website
on:
  push:
    branches:
      - 'main'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Enable Volta
        uses: volta-cli/action@5c175f92dea6f48441c436471e6479dbc192e194 # v4.2.1

      - name: Build website
        run: |
          cd website
          yarn install
          yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@dc18a3c6b46d56484cb63f291becd7ed4f0269b9 # v4.7.1
        with:
          branch: gh-pages
          folder: website/build
          clean: true
