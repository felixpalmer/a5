name: publish

# Publishes a5-js to npm when a version tag (vX.Y.Z, vX.Y.Z-alpha.N, ...) is pushed.
# Uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. Configure the trusted
# publisher for the `a5-js` package on npmjs.com to trust this repo + workflow.
#
# Local release flow:
#   1. bump "version" in package.json (e.g. 0.10.1 or 1.0.0-alpha.1)
#   2. update CHANGELOG.md
#   3. commit, then `./publish.sh beta` (prerelease, from main) or
#      `./publish.sh prod` (stable, from a *-release branch) — tags v<version>
#      and pushes, which triggers this workflow.
# dist-tag: prerelease (version has a '-') → beta, stable → latest.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5.1

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test --run

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # npm's `latest` is a manual pointer, so route prereleases to `beta`;
          # only stable X.Y.Z becomes `latest`. (PyPI/crates need no equivalent.)
          case "$VERSION" in
            *-*) TAG=beta ;;
            *)   TAG=latest ;;
          esac
          echo "Publishing a5-js@$VERSION with dist-tag '$TAG'"
          npm publish --provenance --access public --tag "$TAG"
